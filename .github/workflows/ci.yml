name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend assets + JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS tooling
        run: bun install

      - name: Required vendored/worker artifacts exist
        run: bun run check

      - name: Frontend unit + asset-contract tests
        run: bun run test:js

  parity:
    name: Python ↔ JS parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The parity harnesses load the committed vendor files directly, so no
      # install step is needed — which keeps this job fast and dependency-free.
      - name: Worker, geometry and full-pipeline parity
        run: bun run parity

  backend:
    name: Python tests + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every Python entry point
        run: python -m compileall -q app.py api rscan RScan/Python/scan scripts

      - name: Unit + integration tests
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Flask smoke (health + pages)
        run: |
          python - <<'PY'
          from app import app
          client = app.test_client()

          health = client.get("/api/health")
          assert health.status_code == 200, health.status_code
          assert health.get_json()["status"] == "ok"

          for path in ("/", "/scan-pdf"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
              html = response.get_data(as_text=True)
              assert "uploadZone" in html, path
              assert "stepLog" in html, path
              assert "resultsGrid" in html, path
          print("pages ok")
          PY
